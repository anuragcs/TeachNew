# Nginx configuration for reverse proxy, load balancing, SSL termination, and caching static assets

# Define backend servers for load balancing
upstream backend {
    # Add backend server instances here
    server 127.0.0.1:4000;  # Primary backend server
    # server 127.0.0.1:4001;  # Additional backend server example
}

server {
    listen 80;
    server_name yourdomain.com;  # Replace with your domain

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com;  # Replace with your domain

    # SSL certificate files - replace with your actual certificate paths
    ssl_certificate /etc/ssl/certs/your_cert.pem;
    ssl_certificate_key /etc/ssl/private/your_key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy settings for API requests
    location /api/v1/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve static files (React build or public folder)
    location / {
        root /path/to/your/react/build;  # Replace with actual path to React build directory
        index index.html;
        try_files $uri /index.html;

        # Cache static assets for 30 days
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
